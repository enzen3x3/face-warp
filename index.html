<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FACEratio SHADE</title>
<style>
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a28;--border:#2a2a3f;
  --gold:#c8a96e;--gold2:#e8c88e;--silver:#8ab0c0;
  --text:#e8e0d0;--text2:#8a7a6a;--text3:#3a3a4a;
  --accent:#e87858;--green:#58c888;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Yu Gothic',sans-serif;min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding:0 0 80px;}

header{padding:28px 20px 20px;text-align:center;border-bottom:1px solid var(--border);}
.logo{font-size:9px;letter-spacing:7px;color:var(--gold);margin-bottom:8px;}
header h1{font-size:22px;font-weight:900;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
header p{font-size:11px;color:var(--text2);line-height:1.7;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;margin:12px 14px;overflow:hidden;}
.card-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.num{width:24px;height:24px;border-radius:50%;background:var(--border);color:var(--text2);
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s;}
.num.done{background:var(--gold);color:#000;}
.card-head h2{font-size:13px;font-weight:700;}
.card-body{padding:14px;}

.upload-area{border:2px dashed var(--border);border-radius:12px;padding:22px 14px;text-align:center;
  cursor:pointer;background:var(--surface2);display:flex;flex-direction:column;align-items:center;gap:6px;}
.upload-area.loaded{border-style:solid;border-color:var(--gold);}
.upload-area .icon{font-size:30px;}
.upload-area .label{font-size:13px;color:var(--text2);}
.upload-area .sub{font-size:10px;color:var(--text3);}
input[type=file]{display:none;}

.btn-row{display:flex;gap:8px;margin-top:8px;}
.btn-cam{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;}
#camSection{display:none;margin-top:8px;}
#camVideo{display:block;width:100%;border-radius:10px;background:#000;}
.cam-btns{display:flex;gap:6px;margin-top:6px;}
.cam-btns button{flex:1;padding:9px;border-radius:9px;border:none;font-size:11px;font-weight:700;cursor:pointer;}
.cam-shoot{background:linear-gradient(135deg,var(--gold),var(--accent));color:#000;}
.cam-switch,.cam-cancel{background:var(--surface2);border:1.5px solid var(--border)!important;color:var(--text2);}

/* 比率 */
.ratio-switch{display:flex;gap:8px;}
.ratio-btn{flex:1;padding:14px 8px;border-radius:12px;border:2px solid var(--border);
  background:var(--surface2);cursor:pointer;text-align:center;transition:all .2s;}
.ratio-btn.active-gold{border-color:var(--gold);background:rgba(200,169,110,.08);}
.ratio-btn.active-silver{border-color:var(--silver);background:rgba(138,176,192,.08);}
.ratio-btn .name{font-size:14px;font-weight:800;}
.ratio-btn .num2{font-size:10px;color:var(--text2);margin-top:3px;}
.ratio-btn .desc{font-size:9px;color:var(--text3);margin-top:2px;}
.ratio-btn.active-gold .name{color:var(--gold2);}
.ratio-btn.active-silver .name{color:var(--silver);}

/* スライダー群 */
.sliders{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.slider-wrap{display:flex;align-items:center;gap:10px;}
.slider-wrap label{font-size:11px;color:var(--text2);white-space:nowrap;width:90px;}
input[type=range]{flex:1;accent-color:var(--gold);}
.slval{font-size:11px;color:var(--text2);width:32px;text-align:right;}

/* トグル */
.toggle-group{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.toggle-row{display:flex;align-items:center;gap:10px;}
.tog{width:34px;height:18px;background:var(--border);border-radius:9px;cursor:pointer;
  position:relative;transition:background .2s;flex-shrink:0;}
.tog.on{background:var(--gold);}
.tog::after{content:'';position:absolute;width:12px;height:12px;background:#fff;
  border-radius:50%;top:3px;left:3px;transition:left .2s;}
.tog.on::after{left:19px;}
.toggle-row label{font-size:11px;color:var(--text2);}

/* ボタン */
.btn-primary{width:100%;padding:14px;border:none;border-radius:13px;
  background:linear-gradient(135deg,var(--gold),var(--accent));
  color:#000;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:8px;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}

/* ステータス */
.stbox{padding:10px 14px;border-radius:10px;font-size:12px;text-align:center;display:none;margin-bottom:8px;}
.stbox.show{display:block;}
.stbox.ok{background:rgba(88,200,136,.1);border:1px solid rgba(88,200,136,.3);color:var(--green);}
.stbox.err{background:rgba(232,120,88,.1);border:1px solid rgba(232,120,88,.3);color:var(--accent);}
.stbox.info{background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.2);color:var(--gold);}

.prog{height:3px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:8px;display:none;}
.prog.show{display:block;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:3px;transition:width .3s;}

/* 結果 */
.result-box{background:#000;border-radius:12px;overflow:hidden;min-height:180px;
  display:flex;align-items:center;justify-content:center;}
canvas{display:block;width:100%;}
.ph{padding:32px 16px;text-align:center;color:var(--text3);font-size:11px;line-height:2;}
.ph span{font-size:32px;display:block;margin-bottom:6px;}

/* 比較ボタン */
.cmp-btns{display:none;gap:6px;margin-bottom:10px;}
.cmp-btn{flex:1;padding:7px 4px;border:1.5px solid var(--border);border-radius:9px;
  background:var(--surface2);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;}
.cmp-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(200,169,110,.08);}

.btn-row2{display:none;gap:8px;margin-top:8px;}
.btn-sub{flex:1;padding:11px;border:1.5px solid var(--border);border-radius:11px;
  background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;}

/* 分析パネル */
.analysis{margin-top:12px;display:none;}
.analysis.show{display:block;}
.analysis-title{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px;padding-left:2px;}
.parts-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.part-card{padding:10px 12px;background:var(--surface2);border-radius:10px;border:1px solid var(--border);}
.part-name{font-size:10px;color:var(--text2);margin-bottom:4px;}
.part-bar-wrap{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
.part-bar{height:100%;border-radius:2px;transition:width .6s;}
.part-bar.shade{background:linear-gradient(90deg,#4a3060,#8a50a0);}
.part-bar.hl{background:linear-gradient(90deg,var(--gold),#fff8e0);}
.part-val{font-size:9px;color:var(--text3);margin-top:3px;text-align:right;}

.advice-box{margin-top:10px;padding:12px 14px;background:rgba(200,169,110,.05);
  border:1px solid rgba(200,169,110,.2);border-radius:11px;font-size:11px;
  color:var(--text);line-height:1.9;}
</style>
</head>
<body>
<div class="app">

<header>
  <div class="logo">FACERATIO SHADE</div>
  <h1>シェーディング提案</h1>
  <p>黄金比との差分から<br>シェーディング＆ハイライトを自動合成</p>
</header>

<!-- STEP 1 -->
<div class="card">
  <div class="card-head"><div class="num" id="n1">1</div><h2>顔写真を選ぶ</h2></div>
  <div class="card-body">
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('photoIn').click()">
      <span class="icon">🖼</span>
      <span class="label">タップして写真を選択</span>
      <span class="sub">正面・明るい場所推奨</span>
    </div>
    <input type="file" id="photoIn" accept="image/*">
    <div class="btn-row">
      <button class="btn-cam" onclick="startCam()">📷 カメラで撮影</button>
    </div>
    <div id="camSection">
      <video id="camVideo" playsinline muted></video>
      <div class="cam-btns">
        <button class="cam-switch" onclick="switchCam()">🔄 切替</button>
        <button class="cam-shoot" onclick="shootCam()">⬤ 撮影</button>
        <button class="cam-cancel" onclick="stopCam()">✕</button>
      </div>
    </div>
  </div>
</div>

<!-- STEP 2 -->
<div class="card">
  <div class="card-head"><div class="num" id="n2">2</div><h2>目標の比率と強度</h2></div>
  <div class="card-body">
    <div class="ratio-switch">
      <div class="ratio-btn active-gold" id="btnG" onclick="setRatio('gold')">
        <div class="name">✨ 黄金比</div>
        <div class="num2">1 : 1.618</div>
        <div class="desc">大人・美人顔</div>
      </div>
      <div class="ratio-btn" id="btnS" onclick="setRatio('silver')">
        <div class="name">🌸 白銀比</div>
        <div class="num2">1 : 1.414</div>
        <div class="desc">かわいい・若顔</div>
      </div>
    </div>
    <div class="sliders">
      <div class="slider-wrap">
        <label>シェーディング</label>
        <input type="range" id="shadeSlider" min="0" max="100" value="60" oninput="updateSlider('shade',this.value)">
        <span class="slval" id="shadeVal">60%</span>
      </div>
      <div class="slider-wrap">
        <label>ハイライト</label>
        <input type="range" id="hlSlider" min="0" max="100" value="50" oninput="updateSlider('hl',this.value)">
        <span class="slval" id="hlVal">50%</span>
      </div>
      <div class="slider-wrap">
        <label>ぼかし</label>
        <input type="range" id="blurSlider" min="0" max="100" value="70" oninput="updateSlider('blur',this.value)">
        <span class="slval" id="blurVal">70%</span>
      </div>
    </div>
    <div class="toggle-group">
      <div class="toggle-row">
        <div class="tog on" id="togShade" onclick="toggleOpt('shade')"></div>
        <label>シェーディングを入れる（小顔・引き締め）</label>
      </div>
      <div class="toggle-row">
        <div class="tog on" id="togHL" onclick="toggleOpt('hl')"></div>
        <label>ハイライトを入れる（立体感・艶）</label>
      </div>
      <div class="toggle-row">
        <div class="tog on" id="togGuide" onclick="toggleOpt('guide')"></div>
        <label>ガイドライン表示</label>
      </div>
    </div>
  </div>
</div>

<!-- STEP 3 -->
<div class="card">
  <div class="card-head"><div class="num" id="n3">3</div><h2>シェーディングを適用</h2></div>
  <div class="card-body">
    <button class="btn-primary" id="applyBtn" onclick="doApply()" disabled>✨ シェーディングを適用</button>
    <div class="stbox info show" id="stbox">写真を選択してください</div>
    <div class="prog" id="prog"><div class="prog-fill" id="progFill" style="width:0"></div></div>

    <div class="cmp-btns" id="cmpBtns">
      <button class="cmp-btn on" id="cOrig" onclick="showView('orig')">元の顔</button>
      <button class="cmp-btn" id="cShade" onclick="showView('shade')">合成後</button>
      <button class="cmp-btn" id="cSide" onclick="showView('side')">比較</button>
    </div>

    <div class="result-box">
      <div class="ph" id="ph"><span>✨</span>写真を選択して<br>「シェーディングを適用」をタップ</div>
      <canvas id="rc" style="display:none"></canvas>
    </div>

    <div class="analysis" id="analysis">
      <div class="analysis-title">📊 部位別シェーディング量</div>
      <div class="parts-grid" id="partsGrid"></div>
      <div class="advice-box" id="adviceBox"></div>
    </div>

    <div class="btn-row2" id="saveRow">
      <button class="btn-sub" onclick="doApply()">↩ 再適用</button>
      <button class="btn-sub" onclick="saveImg()">💾 保存</button>
    </div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
// ============================================================
// 定数
// ============================================================
var PHI = 1.6180339887;
var SQ2 = Math.SQRT2;

var KP = {
  faceTop:10, faceBot:152, faceL:234, faceR:454,
  eyeLO:33,  eyeLI:133,  eyeRO:263, eyeRI:362,
  eyeLC:468, eyeRC:473,
  noseTip:4, noseRoot:168, noseBridge:6,
  noseL:129, noseR:358,
  mouthL:61, mouthR:291, mouthT:0, mouthB:17,
  chin:175,
  // 顔輪郭（左側）
  jawL: [234,227,116,123,147,213,192,214,210,211,212],
  // 顔輪郭（右側）
  jawR: [454,447,345,352,376,433,416,434,430,431,432],
  // あごライン
  jawBot: [152,148,176,149,150,136,172,58,132,93,234,454,323,361,288,397,365,379,378,400,377],
  // 鼻筋
  noseBridgeLine: [168,6,197,195,5,4],
  // 額中央
  foreheadC: [10,151,9,8,107,66,105,63,70],
  // 頬骨（ハイライト）
  cheekL: [116,117,118,119,120,121,128,245,244,243,242,241,240,239],
  cheekR: [345,346,347,348,349,350,357,465,464,463,462,461,460,459],
};

// 顔輪郭全体のインデックス
var FACE_OVAL = [
  10,338,297,332,284,251,389,356,454,323,361,288,
  397,365,379,378,400,377,152,148,176,149,150,136,
  172,58,132,93,234,127,162,21,54,103,67,109
];

// ============================================================
// 状態
// ============================================================
var photo     = null;
var ratio     = 'gold';
var shadeStr  = 0.6;
var hlStr     = 0.5;
var blurStr   = 0.7;
var useShade  = true;
var useHL     = true;
var useGuide  = true;
var lms       = null;
var resultData= null;
var curView   = 'shade';
var faceMesh  = null;
var fmReady   = false;
var fmCb      = null;
var camStream = null;
var camFacing = 'user';

// ============================================================
// FaceMesh
// ============================================================
function initFM() {
  if (faceMesh) return;
  st('顔検出エンジンをロード中…', 'info');
  try {
    faceMesh = new FaceMesh({
      locateFile: function(f){ return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/' + f; }
    });
    faceMesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.4, minTrackingConfidence:0.4 });
    faceMesh.onResults(function(res){ if(fmCb){ fmCb(res); fmCb=null; } });
    faceMesh.initialize().then(function(){
      fmReady = true;
      st('エンジン準備完了！', 'ok');
      setTimeout(function(){ document.getElementById('stbox').classList.remove('show'); }, 1500);
    }).catch(function(e){ st('初期化失敗: '+e.message, 'err'); });
  } catch(e) { st('エラー: '+e.message, 'err'); }
}

function detectFace(imgEl) {
  return new Promise(function(resolve, reject) {
    if (!fmReady) { reject(new Error('エンジン未準備')); return; }
    var timer = setTimeout(function(){ fmCb=null; reject(new Error('タイムアウト')); }, 12000);
    fmCb = function(res) {
      clearTimeout(timer);
      if (res.multiFaceLandmarks && res.multiFaceLandmarks.length > 0) resolve(res.multiFaceLandmarks[0]);
      else reject(new Error('顔が検出できませんでした'));
    };
    faceMesh.send({ image: imgEl }).catch(function(e){ clearTimeout(timer); fmCb=null; reject(e); });
  });
}

// ============================================================
// カメラ
// ============================================================
async function startCam() {
  if (camStream) { camStream.getTracks().forEach(function(t){t.stop();}); camStream=null; }
  var cons = [{video:{facingMode:{exact:camFacing}},audio:false},{video:{facingMode:camFacing},audio:false},{video:true,audio:false}];
  for (var c of cons) { try { camStream=await navigator.mediaDevices.getUserMedia(c); break; } catch(e){} }
  if (!camStream) { st('カメラを起動できません', 'err'); return; }
  var v=document.getElementById('camVideo'); v.srcObject=camStream; v.play();
  document.getElementById('camSection').style.display='block';
}
function switchCam(){ camFacing=camFacing==='user'?'environment':'user'; startCam(); }
function shootCam(){
  var v=document.getElementById('camVideo'); if(!v.videoWidth) return;
  var c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  var cx=c.getContext('2d');
  if(camFacing==='user'){cx.translate(c.width,0);cx.scale(-1,1);}
  cx.drawImage(v,0,0);
  var img=new Image(); img.onload=function(){setPhoto(img);stopCam();}; img.src=c.toDataURL('image/jpeg',0.92);
}
function stopCam(){
  if(camStream){camStream.getTracks().forEach(function(t){t.stop();});camStream=null;}
  document.getElementById('camSection').style.display='none';
  document.getElementById('camVideo').srcObject=null;
}

// ============================================================
// 写真
// ============================================================
document.getElementById('photoIn').addEventListener('change', function(e){
  var f=e.target.files[0]; if(!f) return; e.target.value='';
  var r=new FileReader();
  r.onload=function(ev){ var img=new Image(); img.onload=function(){setPhoto(img);}; img.src=ev.target.result; };
  r.readAsDataURL(f);
});

function setPhoto(img){
  photo=img; lms=null; resultData=null;
  document.getElementById('n1').classList.add('done');
  var ua=document.getElementById('uploadArea');
  ua.classList.add('loaded');
  ua.innerHTML='<span style="font-size:18px">✅</span><span style="font-size:12px;color:var(--gold)">読み込み完了（タップで変更）</span>';
  document.getElementById('applyBtn').disabled=false;
  document.getElementById('cmpBtns').style.display='none';
  document.getElementById('saveRow').style.display='none';
  document.getElementById('analysis').classList.remove('show');
  document.getElementById('ph').style.display='block';
  document.getElementById('rc').style.display='none';
  st('写真OK！「シェーディングを適用」を押してください', 'ok');
  if (!faceMesh) initFM();
}

function setRatio(r){
  ratio=r;
  document.getElementById('btnG').className='ratio-btn'+(r==='gold'?' active-gold':'');
  document.getElementById('btnS').className='ratio-btn'+(r==='silver'?' active-silver':'');
}
function updateSlider(type, v){
  var val=parseInt(v)/100;
  if(type==='shade') shadeStr=val;
  else if(type==='hl') hlStr=val;
  else blurStr=val;
  document.getElementById(type+'Val').textContent=v+'%';
}
function toggleOpt(type){
  if(type==='shade'){ useShade=!useShade; document.getElementById('togShade').className='tog'+(useShade?' on':''); }
  else if(type==='hl'){ useHL=!useHL; document.getElementById('togHL').className='tog'+(useHL?' on':''); }
  else { useGuide=!useGuide; document.getElementById('togGuide').className='tog'+(useGuide?' on':''); }
}

// ============================================================
// メイン処理
// ============================================================
async function doApply(){
  if (!photo) { st('写真を先に選択してください','err'); return; }
  document.getElementById('applyBtn').disabled=true;
  setProg(0,true);

  try {
    if (!fmReady) {
      if (!faceMesh) initFM();
      st('エンジン起動中…','info');
      for (var i=0;i<30;i++){ await sleep(500); if(fmReady) break; }
      if (!fmReady) throw new Error('エンジンの起動に失敗しました');
    }

    st('顔を検出中…','info'); setProg(20);
    var rawLms = await detectFace(photo);
    setProg(40);

    var W=photo.naturalWidth, H=photo.naturalHeight;
    lms = rawLms.map(function(p){ return {x:p.x*W, y:p.y*H}; });
    setProg(55);

    // シェーディングマップ生成
    st('シェーディングを計算中…','info');
    var rc=document.getElementById('rc');
    rc.width=W; rc.height=H;
    var ctx=rc.getContext('2d');

    // 元画像描画
    ctx.drawImage(photo,0,0);
    setProg(65);

    // シェーディング・ハイライト合成
    await applyShading(ctx, lms, W, H);
    setProg(90);

    // ガイドライン
    if (useGuide) drawGuides(ctx, lms, W, H);
    setProg(100);

    // UI更新
    document.getElementById('ph').style.display='none';
    rc.style.display='block';
    document.getElementById('cmpBtns').style.display='flex';
    document.getElementById('saveRow').style.display='flex';
    document.getElementById('n3').classList.add('done');
    curView='shade'; updCmp('shade');

    showAnalysis(lms, W, H);
    st('✨ 完成！比較ボタンで確認できます','ok');

  } catch(e) { st('❌ '+e.message,'err'); }

  setProg(0,false);
  document.getElementById('applyBtn').disabled=false;
}

function sleep(ms){ return new Promise(function(r){setTimeout(r,ms);}); }

// ============================================================
// シェーディング・ハイライト合成
// ============================================================
async function applyShading(ctx, lm, W, H) {
  var targetR = ratio==='gold' ? PHI : SQ2;

  // 顔の基本情報
  var fTop=lm[KP.faceTop].y, fBot=lm[KP.faceBot].y;
  var fL=lm[KP.faceL].x,     fR=lm[KP.faceR].x;
  var fH=fBot-fTop, fW=fR-fL;
  var fCX=(fL+fR)/2, fCY=(fTop+fBot)/2;
  var curR=fH/fW;

  // 肌色サンプリング（頬中央あたりから）
  var skinColor = sampleSkin(ctx, lm, W, H);

  // ====================================================
  // 1. 輪郭シェーディング（顔の端を絞って見せる）
  // ====================================================
  if (useShade) {
    // 左右の輪郭にシェーディング
    // 顔の理想幅との差分を計算
    var idealW = fH / targetR;
    var excessW = (fW - idealW) / 2; // 片側の余分な幅

    // 輪郭シェーディングの幅（顔幅の比率で決まる）
    var shadeWidth = Math.max(fW * 0.12, excessW * 0.8);

    // 左輪郭シェーディング
    drawShadeGradient(ctx, {
      x: fL, y: fTop,
      w: shadeWidth * 2,
      h: fH,
      dir: 'left',   // 左から右へフェード
      alpha: shadeStr * 0.55,
      skinColor: skinColor,
      clipPath: buildOvalPath(lm, W, H),
    });

    // 右輪郭シェーディング
    drawShadeGradient(ctx, {
      x: fR - shadeWidth * 2, y: fTop,
      w: shadeWidth * 2,
      h: fH,
      dir: 'right',  // 右から左へフェード
      alpha: shadeStr * 0.55,
      skinColor: skinColor,
      clipPath: buildOvalPath(lm, W, H),
    });

    // あごシェーディング（縦が短い場合に下を絞る）
    if (curR < targetR * 0.9) {
      var chinShadeH = fH * 0.18;
      drawShadeGradient(ctx, {
        x: fCX - fW*0.4, y: fBot - chinShadeH,
        w: fW * 0.8,
        h: chinShadeH,
        dir: 'bottom',
        alpha: shadeStr * 0.4,
        skinColor: skinColor,
        clipPath: buildOvalPath(lm, W, H),
      });
    }

    // こめかみシェーディング
    var templeW = fW * 0.15;
    var templeH = fH * 0.35;
    drawShadeGradient(ctx, {
      x: fL, y: fTop,
      w: templeW, h: templeH,
      dir: 'left',
      alpha: shadeStr * 0.35,
      skinColor: skinColor,
      clipPath: buildOvalPath(lm, W, H),
    });
    drawShadeGradient(ctx, {
      x: fR - templeW, y: fTop,
      w: templeW, h: templeH,
      dir: 'right',
      alpha: shadeStr * 0.35,
      skinColor: skinColor,
      clipPath: buildOvalPath(lm, W, H),
    });
  }

  // ====================================================
  // 2. ハイライト（鼻筋・額中央・あご先・頬骨）
  // ====================================================
  if (useHL) {
    var hlAlpha = hlStr * 0.45;

    // 鼻筋ハイライト
    var noseRoot = lm[KP.noseRoot];
    var noseTip  = lm[KP.noseTip];
    var noseLineW = fW * 0.04;
    drawHLStripe(ctx, noseRoot.x, noseRoot.y, noseTip.x, noseTip.y, noseLineW, hlAlpha);

    // 額中央ハイライト
    var foreW = fW * 0.14;
    var foreH = fH * 0.20;
    drawHLEllipse(ctx, fCX, fTop + foreH*0.5, foreW*0.5, foreH*0.5, hlAlpha * 0.7);

    // あご先ハイライト
    var chin = lm[KP.chin];
    drawHLEllipse(ctx, chin.x, chin.y - fH*0.01, fW*0.06, fH*0.03, hlAlpha * 0.65);

    // 頬骨ハイライト（目の下あたり）
    var eyeLC = lm[KP.eyeLC] || lm[KP.eyeLI];
    var eyeRC = lm[KP.eyeRC] || lm[KP.eyeRI];
    var cheekHL_y = eyeLC.y + fH * 0.08;
    var cheekHL_x_L = eyeLC.x - fW * 0.02;
    var cheekHL_x_R = eyeRC.x + fW * 0.02;
    drawHLEllipse(ctx, cheekHL_x_L, cheekHL_y, fW*0.10, fH*0.04, hlAlpha * 0.5);
    drawHLEllipse(ctx, cheekHL_x_R, cheekHL_y, fW*0.10, fH*0.04, hlAlpha * 0.5);
  }
}

// ============================================================
// 描画ヘルパー
// ============================================================

// 顔の楕円クリップパスを構築
function buildOvalPath(lm, W, H) {
  var path = new Path2D();
  path.moveTo(lm[FACE_OVAL[0]].x, lm[FACE_OVAL[0]].y);
  for (var i=1; i<FACE_OVAL.length; i++) {
    path.lineTo(lm[FACE_OVAL[i]].x, lm[FACE_OVAL[i]].y);
  }
  path.closePath();
  return path;
}

// グラデーションシェーディング
function drawShadeGradient(ctx, opts) {
  ctx.save();
  if (opts.clipPath) ctx.clip(opts.clipPath);

  var sc = opts.skinColor;
  // 肌色より少し暗い色をシェーディングカラーに
  var r = Math.max(0, sc.r - 40);
  var g = Math.max(0, sc.g - 35);
  var b = Math.max(0, sc.b - 25);

  var blur = blurStr * 60;
  var grad;

  if (opts.dir === 'left') {
    grad = ctx.createLinearGradient(opts.x, 0, opts.x + opts.w, 0);
    grad.addColorStop(0, 'rgba('+r+','+g+','+b+','+opts.alpha+')');
    grad.addColorStop(1, 'rgba('+r+','+g+','+b+',0)');
  } else if (opts.dir === 'right') {
    grad = ctx.createLinearGradient(opts.x + opts.w, 0, opts.x, 0);
    grad.addColorStop(0, 'rgba('+r+','+g+','+b+','+opts.alpha+')');
    grad.addColorStop(1, 'rgba('+r+','+g+','+b+',0)');
  } else {
    grad = ctx.createLinearGradient(0, opts.y + opts.h, 0, opts.y);
    grad.addColorStop(0, 'rgba('+r+','+g+','+b+','+opts.alpha+')');
    grad.addColorStop(1, 'rgba('+r+','+g+','+b+',0)');
  }

  ctx.filter = 'blur(' + blur + 'px)';
  ctx.fillStyle = grad;
  ctx.fillRect(opts.x, opts.y, opts.w, opts.h);
  ctx.restore();
}

// 楕円ハイライト
function drawHLEllipse(ctx, cx, cy, rx, ry, alpha) {
  ctx.save();
  ctx.filter = 'blur(' + (blurStr * 30 + 8) + 'px)';
  var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(rx, ry));
  grad.addColorStop(0, 'rgba(255,248,220,' + alpha + ')');
  grad.addColorStop(0.5, 'rgba(255,248,200,' + (alpha*0.4) + ')');
  grad.addColorStop(1, 'rgba(255,248,200,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rx*2.5, ry*2.5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

// 線状ハイライト（鼻筋用）
function drawHLStripe(ctx, x1, y1, x2, y2, w, alpha) {
  ctx.save();
  ctx.filter = 'blur(' + (blurStr * 20 + 5) + 'px)';
  var len = Math.hypot(x2-x1, y2-y1);
  var angle = Math.atan2(y2-y1, x2-x1);
  ctx.translate(x1, y1);
  ctx.rotate(angle);
  var grad = ctx.createLinearGradient(-w, 0, w, 0);
  grad.addColorStop(0, 'rgba(255,252,230,0)');
  grad.addColorStop(0.5, 'rgba(255,252,230,' + alpha + ')');
  grad.addColorStop(1, 'rgba(255,252,230,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, -w*1.5, len, w*3);
  ctx.restore();
}

// ガイドライン描画
function drawGuides(ctx, lm, W, H) {
  var targetR = ratio==='gold' ? PHI : SQ2;
  var fTop=lm[KP.faceTop].y, fBot=lm[KP.faceBot].y;
  var fL=lm[KP.faceL].x,     fR=lm[KP.faceR].x;
  var fH=fBot-fTop, fW=fR-fL;
  var fCX=(fL+fR)/2, fCY=(fTop+fBot)/2;
  var idealW = fH / targetR;

  ctx.save();
  ctx.setLineDash([6,4]);
  ctx.lineWidth = Math.max(1, W/500);

  // 理想の横幅ライン（左右）
  var idealL = fCX - idealW/2;
  var idealR = fCX + idealW/2;
  ctx.strokeStyle = 'rgba(200,169,110,0.6)';
  ctx.beginPath(); ctx.moveTo(idealL, fTop); ctx.lineTo(idealL, fBot); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(idealR, fTop); ctx.lineTo(idealR, fBot); ctx.stroke();

  // 顔の三分割ライン
  ctx.strokeStyle = 'rgba(200,169,110,0.35)';
  var third = fH / 3;
  [1,2].forEach(function(i){
    ctx.beginPath();
    ctx.moveTo(fL, fTop + third*i);
    ctx.lineTo(fR, fTop + third*i);
    ctx.stroke();
  });

  // 中心ライン
  ctx.strokeStyle = 'rgba(200,169,110,0.2)';
  ctx.beginPath(); ctx.moveTo(fCX, fTop); ctx.lineTo(fCX, fBot); ctx.stroke();

  ctx.restore();
}

// 肌色サンプリング
function sampleSkin(ctx, lm, W, H) {
  // 左頬あたりをサンプル
  var eyeLC = lm[KP.eyeLC] || lm[KP.eyeLI];
  var noseTip = lm[KP.noseTip];
  var sx = Math.round((eyeLC.x + noseTip.x) / 2);
  var sy = Math.round((eyeLC.y + noseTip.y) / 2);
  sx = Math.max(0, Math.min(W-1, sx));
  sy = Math.max(0, Math.min(H-1, sy));
  var px = ctx.getImageData(sx, sy, 1, 1).data;
  return { r: px[0], g: px[1], b: px[2] };
}

// ============================================================
// 分析パネル
// ============================================================
function showAnalysis(lm, W, H) {
  var targetR = ratio==='gold' ? PHI : SQ2;
  var fTop=lm[KP.faceTop].y, fBot=lm[KP.faceBot].y;
  var fL=lm[KP.faceL].x,     fR=lm[KP.faceR].x;
  var fH=fBot-fTop, fW=fR-fL;
  var curR=fH/fW;
  var diff=Math.abs(targetR-curR)/targetR;

  var idealW = fH/targetR;
  var excessPct = Math.round(((fW/idealW)-1)*100);

  var parts = [
    {name:'左輪郭', shade:Math.min(100,excessPct+10), hl:0},
    {name:'右輪郭', shade:Math.min(100,excessPct+10), hl:0},
    {name:'鼻筋',   shade:0, hl:70},
    {name:'額中央', shade:0, hl:55},
    {name:'頬骨',   shade:0, hl:45},
    {name:'あご先', shade:0, hl:50},
  ];

  var grid = document.getElementById('partsGrid');
  grid.innerHTML = '';
  parts.forEach(function(p){
    var card = document.createElement('div');
    card.className = 'part-card';
    var shadeBar = p.shade>0 ? '<div class="part-bar-wrap"><div class="part-bar shade" style="width:'+p.shade+'%"></div></div><div class="part-val">陰 '+p.shade+'%</div>' : '';
    var hlBar    = p.hl>0   ? '<div class="part-bar-wrap"><div class="part-bar hl" style="width:'+p.hl+'%"></div></div><div class="part-val">光 '+p.hl+'%</div>' : '';
    card.innerHTML = '<div class="part-name">'+p.name+'</div>'+shadeBar+hlBar;
    grid.appendChild(card);
  });

  var advice = document.getElementById('adviceBox');
  var targetName = ratio==='gold' ? '黄金比（1.618）' : '白銀比（1.414）';
  advice.innerHTML =
    '📏 現在の縦横比 <strong>'+curR.toFixed(3)+'</strong> → 目標 <strong>'+targetR.toFixed(3)+'</strong><br>' +
    (excessPct>0 ?
      '顔幅が理想より約<strong>'+excessPct+'%</strong>広め。<br>両サイドのシェーディングで引き締め効果が出ます。' :
      '縦横比はほぼ理想的です！<br>ハイライトで立体感を加えましょう。') +
    '<br><br>💄 <strong>メイクのコツ</strong><br>' +
    '① 輪郭に沿ってシェーディングをのせる<br>' +
    '② 鼻筋・額中央・あご先にハイライト<br>' +
    '③ ブラシでよくぼかして自然に仕上げる';

  document.getElementById('analysis').classList.add('show');
}

// ============================================================
// 表示切替
// ============================================================
function showView(type){
  curView=type;
  updCmp(type);
  var rc=document.getElementById('rc');
  var ctx=rc.getContext('2d');
  var W=photo.naturalWidth, H=photo.naturalHeight;

  if (type==='side'){
    rc.width=W*2; rc.height=H;
    ctx.drawImage(photo,0,0);
    // 右半分に合成後を再描画するため、再処理
    ctx.drawImage(photo,W,0);
    // ラベル
    ctx.fillStyle='rgba(0,0,0,.5)';
    ctx.fillRect(0,0,W,30); ctx.fillRect(W,0,W,30);
    ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
    ctx.fillText('元の顔', W/2, 21);
    ctx.fillText('シェーディング後', W+W/2, 21);
    // 右側にシェーディング再適用
    applyShading(ctx, lms, W*2, H).then(function(){
      if(useGuide) drawGuides(ctx, lms, W*2, H);
    });
  } else {
    rc.width=W; rc.height=H;
    ctx.drawImage(photo,0,0);
    if (type==='shade'){
      applyShading(ctx, lms, W, H).then(function(){
        if(useGuide) drawGuides(ctx, lms, W, H);
      });
    }
  }
}

function updCmp(v){
  document.getElementById('cOrig').className ='cmp-btn'+(v==='orig' ?' on':'');
  document.getElementById('cShade').className='cmp-btn'+(v==='shade'?' on':'');
  document.getElementById('cSide').className ='cmp-btn'+(v==='side' ?' on':'');
}

function saveImg(){
  var rc=document.getElementById('rc');
  var url=rc.toDataURL('image/png');
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
    var w=window.open('','_blank');
    if(w){w.document.write('<img src="'+url+'" style="max-width:100%"><p style="padding:10px;font-family:sans-serif;color:#666">長押しして保存</p>');w.document.close();}
  } else {
    var a=document.createElement('a'); a.download='faceshade_'+Date.now()+'.png'; a.href=url; a.click();
  }
}

// ============================================================
// UI ヘルパー
// ============================================================
function st(msg,type){ var el=document.getElementById('stbox'); el.textContent=msg; el.className='stbox show '+(type||'info'); }
function setProg(pct,show){ var bar=document.getElementById('prog'); if(show!==undefined){if(show)bar.classList.add('show');else{bar.classList.remove('show');return;}} document.getElementById('progFill').style.width=pct+'%'; }
</script>
