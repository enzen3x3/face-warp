<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FACEratio TRANSFORM</title>
<style>
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a28;--border:#2a2a3f;
  --gold:#c8a96e;--gold2:#e8c88e;--silver:#8ab0c0;--silver2:#b0d0e0;
  --text:#e8e0d0;--text2:#8a7a6a;--text3:#3a3a4a;
  --accent:#e87858;--green:#58c888;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Hiragino Sans','Yu Gothic',sans-serif;min-height:100vh;}
.app{max-width:480px;margin:0 auto;padding:0 0 80px;}
header{padding:24px 20px 16px;text-align:center;border-bottom:1px solid var(--border);}
.logo{font-size:9px;letter-spacing:7px;color:var(--gold);margin-bottom:5px;}
header h1{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--gold2),var(--gold),var(--accent));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px;}
header p{font-size:11px;color:var(--text2);line-height:1.7;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;margin:10px 14px;overflow:hidden;}
.card-head{padding:11px 15px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.num{width:22px;height:22px;border-radius:50%;background:var(--border);color:var(--text2);
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.3s;}
.num.done{background:var(--gold);color:#000;}
.card-head h2{font-size:12px;font-weight:700;}
.card-body{padding:12px;}
.upload-area{border:2px dashed var(--border);border-radius:11px;padding:18px 14px;text-align:center;
  cursor:pointer;background:var(--surface2);display:flex;flex-direction:column;align-items:center;gap:4px;}
.upload-area.loaded{border-style:solid;border-color:var(--gold);}
.upload-area .icon{font-size:26px;}
.upload-area .label{font-size:12px;color:var(--text2);}
.upload-area .sub{font-size:10px;color:var(--text3);}
input[type=file]{display:none;}
.btn-row{display:flex;gap:8px;margin-top:7px;}
.btn-cam{flex:1;padding:8px;border-radius:9px;border:1.5px solid var(--border);
  background:var(--surface2);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;}
#camSection{display:none;margin-top:7px;}
#camVideo{display:block;width:100%;border-radius:9px;background:#000;}
.cam-btns{display:flex;gap:5px;margin-top:5px;}
.cam-btns button{flex:1;padding:8px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;}
.cam-shoot{background:linear-gradient(135deg,var(--gold),var(--accent));color:#000;}
.cam-switch,.cam-cancel{background:var(--surface2);border:1.5px solid var(--border)!important;color:var(--text2);}
.ratio-switch{display:flex;gap:7px;}
.ratio-btn{flex:1;padding:12px 7px;border-radius:11px;border:2px solid var(--border);
  background:var(--surface2);cursor:pointer;text-align:center;transition:.2s;}
.ratio-btn.ag{border-color:var(--gold);background:rgba(200,169,110,.08);}
.ratio-btn.as{border-color:var(--silver);background:rgba(138,176,192,.08);}
.rname{font-size:13px;font-weight:800;}
.rnum{font-size:10px;color:var(--text2);margin-top:2px;}
.rdesc{font-size:9px;color:var(--text3);margin-top:1px;}
.ratio-btn.ag .rname{color:var(--gold2);}
.ratio-btn.as .rname{color:var(--silver2);}
.sw{display:flex;align-items:center;gap:8px;margin-top:10px;}
.sw label{font-size:11px;color:var(--text2);white-space:nowrap;width:68px;}
input[type=range]{flex:1;accent-color:var(--gold);}
.sv{font-size:11px;color:var(--text2);width:30px;text-align:right;}
.btn-go{width:100%;padding:13px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--gold),var(--accent));
  color:#000;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:7px;}
.btn-go:disabled{opacity:.4;cursor:not-allowed;}
.stbox{padding:9px 13px;border-radius:9px;font-size:12px;text-align:center;display:none;margin-bottom:7px;}
.stbox.show{display:block;}
.stbox.ok{background:rgba(88,200,136,.1);border:1px solid rgba(88,200,136,.3);color:var(--green);}
.stbox.err{background:rgba(232,120,88,.1);border:1px solid rgba(232,120,88,.3);color:var(--accent);}
.stbox.info{background:rgba(200,169,110,.08);border:1px solid rgba(200,169,110,.2);color:var(--gold);}
.prog{height:3px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:7px;display:none;}
.prog.show{display:block;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));border-radius:3px;transition:width .3s;}
.result-box{background:#111;border-radius:11px;overflow:hidden;min-height:160px;
  display:flex;align-items:center;justify-content:center;position:relative;}
.result-box img,.result-box canvas{display:block;width:100%;}
.ph{padding:28px 14px;text-align:center;color:var(--text3);font-size:11px;line-height:2;}
.ph span{font-size:28px;display:block;margin-bottom:5px;}
.cmp-btns{display:none;gap:5px;margin-bottom:9px;}
.cmp-btn{flex:1;padding:6px 3px;border:1.5px solid var(--border);border-radius:8px;
  background:var(--surface2);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;}
.cmp-btn.on{border-color:var(--gold);color:var(--gold);background:rgba(200,169,110,.08);}
.save-row{display:none;gap:7px;margin-top:7px;}
.btn-sub{flex:1;padding:10px;border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface2);color:var(--text2);font-size:12px;cursor:pointer;}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo">FACERATIO TRANSFORM</div>
  <h1>美人・かわいい顔に変換</h1>
  <p>黄金比・白銀比でパーツを理想位置に ＋ 肌補正</p>
</header>

<!-- STEP 1 -->
<div class="card">
  <div class="card-head"><div class="num" id="n1">1</div><h2>顔写真を選ぶ</h2></div>
  <div class="card-body">
    <div class="upload-area" id="ua" onclick="document.getElementById('fi').click()">
      <span class="icon">🖼</span><span class="label">タップして選択</span><span class="sub">正面・明るい場所推奨</span>
    </div>
    <input type="file" id="fi" accept="image/*">
    <div class="btn-row"><button class="btn-cam" onclick="startCam()">📷 カメラで撮影</button></div>
    <div id="camSection">
      <video id="cv" playsinline muted></video>
      <div class="cam-btns">
        <button class="cam-switch" onclick="switchCam()">🔄 切替</button>
        <button class="cam-shoot" onclick="shoot()">⬤ 撮影</button>
        <button class="cam-cancel" onclick="stopCam()">✕</button>
      </div>
    </div>
  </div>
</div>

<!-- STEP 2 -->
<div class="card">
  <div class="card-head"><div class="num" id="n2">2</div><h2>設定</h2></div>
  <div class="card-body">
    <div class="ratio-switch">
      <div class="ratio-btn ag" id="bG" onclick="setR('gold')">
        <div class="rname">✨ 黄金比</div><div class="rnum">1:1.618</div><div class="rdesc">美人・大人顔</div>
      </div>
      <div class="ratio-btn" id="bS" onclick="setR('silver')">
        <div class="rname">🌸 白銀比</div><div class="rnum">1:1.414</div><div class="rdesc">かわいい顔</div>
      </div>
    </div>
    <div class="sw"><label>変換強度</label><input type="range" id="sStr" min="0" max="100" value="60" oninput="G.str=this.value/100;document.getElementById('vStr').textContent=this.value+'%'"><span class="sv" id="vStr">60%</span></div>
    <div class="sw"><label>シェーディング</label><input type="range" id="sSh" min="0" max="100" value="45" oninput="G.sh=this.value/100;document.getElementById('vSh').textContent=this.value+'%'"><span class="sv" id="vSh">45%</span></div>
    <div class="sw"><label>肌補正</label><input type="range" id="sSkin" min="0" max="100" value="50" oninput="G.skin=this.value/100;document.getElementById('vSkin').textContent=this.value+'%'"><span class="sv" id="vSkin">50%</span></div>
  </div>
</div>

<!-- STEP 3 -->
<div class="card">
  <div class="card-head"><div class="num" id="n3">3</div><h2>変換する</h2></div>
  <div class="card-body">
    <button class="btn-go" id="goBtn" onclick="run()" disabled>✨ 変換する</button>
    <div class="stbox info show" id="st">写真を選択してください</div>
    <div class="prog" id="prog"><div class="prog-fill" id="pf" style="width:0"></div></div>
    <div class="cmp-btns" id="cmpBtns">
      <button class="cmp-btn on" id="cO" onclick="view('orig')">元の顔</button>
      <button class="cmp-btn"   id="cT" onclick="view('trans')">変換後</button>
      <button class="cmp-btn"   id="cS" onclick="view('side')">比較</button>
    </div>
    <div class="result-box" id="rb">
      <div class="ph" id="ph"><span>✨</span>写真を選択して<br>「変換する」をタップ</div>
      <img id="origImg" style="display:none" alt="">
      <canvas id="rc" style="display:none"></canvas>
    </div>
    <div class="save-row" id="saveRow">
      <button class="btn-sub" onclick="run()">↩ 再変換</button>
      <button class="btn-sub" onclick="save()">💾 保存</button>
    </div>
  </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
<script>
// ============================================================
// グローバル状態
// ============================================================
var G = {
  photo: null, ratio: 'gold', str: 0.6, sh: 0.45, skin: 0.5,
  lms: null, transUrl: null, origUrl: null, curView: 'orig',
  fm: null, fmReady: false, fmCb: null,
  cam: null, camFace: 'user'
};

var PHI = 1.6180339887, SQ2 = Math.SQRT2;

// MediaPipe キーポイント
var KP = {
  fT:10, fB:152, fL:234, fR:454,
  eLC:468, eRC:473,          // 目中心(refined)
  eLO:33, eLI:133, eLT:159, eLB:145,
  eRO:263, eRI:362, eRT:386, eRB:374,
  bLL:70, bLR:107, bRL:336, bRR:296,
  nT:4, nR:168, nL:129, nNR:358,
  mL:61, mR:291, mT:13, mB:14,
  chin:175
};

var OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,
            397,365,379,378,400,377,152,148,176,149,150,136,
            172,58,132,93,234,127,162,21,54,103,67,109];

// ============================================================
// FaceMesh 初期化
// ============================================================
function initFM(){
  if(G.fm) return;
  setSt('顔検出エンジンをロード中…','info');
  G.fm = new FaceMesh({locateFile: f => 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f});
  G.fm.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
  G.fm.onResults(res => { if(G.fmCb){G.fmCb(res); G.fmCb=null;} });
  G.fm.initialize().then(()=>{
    G.fmReady = true;
    setSt('準備完了！','ok');
    setTimeout(()=>document.getElementById('st').classList.remove('show'), 1500);
  }).catch(e => setSt('初期化失敗: '+e.message,'err'));
}

function detectFace(img){
  return new Promise((resolve, reject) => {
    if(!G.fmReady){ reject(new Error('エンジン未準備')); return; }
    var t = setTimeout(()=>{ G.fmCb=null; reject(new Error('タイムアウト')); }, 12000);
    G.fmCb = res => {
      clearTimeout(t);
      if(res.multiFaceLandmarks?.length > 0) resolve(res.multiFaceLandmarks[0]);
      else reject(new Error('顔を検出できませんでした。正面の写真を使ってください'));
    };
    G.fm.send({image: img}).catch(e=>{ clearTimeout(t); G.fmCb=null; reject(e); });
  });
}

// ============================================================
// カメラ
// ============================================================
async function startCam(){
  if(G.cam){ G.cam.getTracks().forEach(t=>t.stop()); G.cam=null; }
  var cons = [{video:{facingMode:{exact:G.camFace}},audio:false},{video:true,audio:false}];
  for(var c of cons){ try{ G.cam=await navigator.mediaDevices.getUserMedia(c); break; }catch(e){} }
  if(!G.cam){ setSt('カメラ起動失敗','err'); return; }
  var v=document.getElementById('cv'); v.srcObject=G.cam; v.play();
  document.getElementById('camSection').style.display='block';
}
function switchCam(){ G.camFace=G.camFace==='user'?'environment':'user'; startCam(); }
function shoot(){
  var v=document.getElementById('cv'); if(!v.videoWidth) return;
  var c=document.createElement('canvas'); c.width=v.videoWidth; c.height=v.videoHeight;
  var cx=c.getContext('2d');
  if(G.camFace==='user'){ cx.translate(c.width,0); cx.scale(-1,1); }
  cx.drawImage(v,0,0);
  var img=new Image(); img.onload=()=>setPhoto(img); img.src=c.toDataURL('image/jpeg',0.95);
  stopCam();
}
function stopCam(){
  if(G.cam){ G.cam.getTracks().forEach(t=>t.stop()); G.cam=null; }
  document.getElementById('camSection').style.display='none';
  document.getElementById('cv').srcObject=null;
}

// ============================================================
// 写真セット → 即プレビュー
// ============================================================
document.getElementById('fi').addEventListener('change', e=>{
  var f=e.target.files[0]; if(!f) return; e.target.value='';
  var r=new FileReader();
  r.onload=ev=>{ var img=new Image(); img.onload=()=>setPhoto(img); img.src=ev.target.result; };
  r.readAsDataURL(f);
});

function setPhoto(img){
  G.photo=img; G.lms=null; G.transUrl=null;
  G.origUrl=img.src; // 元画像URL保存

  // UI
  document.getElementById('n1').classList.add('done');
  var ua=document.getElementById('ua');
  ua.classList.add('loaded');
  ua.innerHTML='<span style="font-size:16px">✅</span><span style="font-size:11px;color:var(--gold)">読み込み完了（タップで変更）</span>';
  document.getElementById('goBtn').disabled=false;
  document.getElementById('cmpBtns').style.display='none';
  document.getElementById('saveRow').style.display='none';
  document.getElementById('rc').style.display='none';

  // 元画像を即プレビュー
  var oi=document.getElementById('origImg');
  oi.src=img.src; oi.style.display='block';
  document.getElementById('ph').style.display='none';
  G.curView='orig'; updCmp('orig');
  document.getElementById('cmpBtns').style.display='flex';

  setSt('写真OK！「変換する」を押してください','ok');
  if(!G.fm) initFM();
}

function setR(r){
  G.ratio=r;
  document.getElementById('bG').className='ratio-btn'+(r==='gold'?' ag':'');
  document.getElementById('bS').className='ratio-btn'+(r==='silver'?' as':'');
}

// ============================================================
// メイン変換
// ============================================================
async function run(){
  if(!G.photo){ setSt('写真を選択してください','err'); return; }
  document.getElementById('goBtn').disabled=true;
  setProg(0,true);
  try{
    if(!G.fmReady){
      if(!G.fm) initFM();
      setSt('エンジン起動中…','info');
      for(var i=0;i<30;i++){ await sleep(500); if(G.fmReady) break; }
      if(!G.fmReady) throw new Error('エンジン起動失敗。再度押してください');
    }
    setSt('顔を検出中…','info'); setProg(15);
    var raw=await detectFace(G.photo);
    var W=G.photo.naturalWidth, H=G.photo.naturalHeight;
    G.lms=raw.map(p=>({x:p.x*W, y:p.y*H}));
    setProg(35);

    setSt('変換中…','info');
    var rc=document.getElementById('rc');
    rc.width=W; rc.height=H;
    var ctx=rc.getContext('2d');

    // ワープ実行
    await warpFace(ctx, G.lms, W, H);
    setProg(90);

    // 肌補正
    if(G.skin > 0.01){
      setSt('肌を補正中…','info');
      smoothSkin(ctx, G.lms, W, H);
    }
    setProg(98);

    G.transUrl=rc.toDataURL('image/jpeg',0.95);
    G.curView='trans';
    document.getElementById('origImg').style.display='none';
    rc.style.display='block';
    updCmp('trans');
    document.getElementById('cmpBtns').style.display='flex';
    document.getElementById('saveRow').style.display='flex';
    document.getElementById('n3').classList.add('done');
    setSt('✨ 変換完了！比較ボタンで確認してください','ok');
    setProg(100);
  }catch(e){ setSt('❌ '+e.message,'err'); console.error(e); }
  setProg(0,false);
  document.getElementById('goBtn').disabled=false;
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ============================================================
// ワープ：逆マッピング方式
// 出力画像の各ピクセルに対して、元画像のどこから来るかを計算
// ============================================================
async function warpFace(ctx, lm, W, H){
  var gx=(i,fb)=>lm[i]?lm[i].x:fb;
  var gy=(i,fb)=>lm[i]?lm[i].y:fb;

  var fT=gy(KP.fT,H*.1), fB=gy(KP.fB,H*.9);
  var fL=gx(KP.fL,W*.2), fR=gx(KP.fR,W*.8);
  var fH=fB-fT, fW=fR-fL, fCX=(fL+fR)/2;

  // 現在のパーツ中心（元画像座標）
  var eLx=lm[KP.eLC]?lm[KP.eLC].x:(gx(KP.eLO,0)+gx(KP.eLI,0))/2;
  var eLy=lm[KP.eLC]?lm[KP.eLC].y:(gy(KP.eLT,0)+gy(KP.eLB,0))/2;
  var eRx=lm[KP.eRC]?lm[KP.eRC].x:(gx(KP.eRI,0)+gx(KP.eRO,0))/2;
  var eRy=lm[KP.eRC]?lm[KP.eRC].y:(gy(KP.eRT,0)+gy(KP.eRB,0))/2;
  var nTx=gx(KP.nT,fCX), nTy=gy(KP.nT,fT+fH*.65);
  var mCx=(gx(KP.mL,fCX-fW*.18)+gx(KP.mR,fCX+fW*.18))/2;
  var mCy=(gy(KP.mT,fT+fH*.78)+gy(KP.mB,fT+fH*.83))/2;
  var browCx=fCX, browCy=(eLy+eRy)/2-fH*.07;

  // 理想位置
  var isG=G.ratio==='gold';
  var idEy=fT+fH*(isG?.333:.380);
  var idNy=fT+fH*(isG?.667:.650);
  var idMy=fT+fH*(isG?.820:.800);
  var idES=fW*0.42;
  var idELx=fCX-idES/2, idERx=fCX+idES/2;

  // 各パーツの移動量（順方向：元→出力）
  var moves=[
    {cx:eLx,   cy:eLy,   r:fW*.25, fdx:(idELx-eLx)*G.str, fdy:(idEy-eLy)*G.str},
    {cx:eRx,   cy:eRy,   r:fW*.25, fdx:(idERx-eRx)*G.str, fdy:(idEy-eRy)*G.str},
    {cx:nTx,   cy:nTy,   r:fW*.22, fdx:0,                  fdy:(idNy-nTy)*G.str},
    {cx:mCx,   cy:mCy,   r:fW*.20, fdx:0,                  fdy:(idMy-mCy)*G.str},
    {cx:browCx,cy:browCy,r:fW*.32, fdx:0,                  fdy:(idEy-eLy)*G.str*0.7},
  ];

  // ダウンサンプリング（高速化）
  var sc=Math.min(1,700/Math.max(W,H));
  var sW=Math.round(W*sc), sH=Math.round(H*sc);

  var wc=document.createElement('canvas'); wc.width=sW; wc.height=sH;
  var wctx=wc.getContext('2d');
  wctx.drawImage(G.photo,0,0,sW,sH);
  var src=wctx.getImageData(0,0,sW,sH).data;
  var out=new Uint8ClampedArray(sW*sH*4);

  // 逆マッピング
  // 出力ピクセル(ox,oy)に対して、元画像のどこ(sx,sy)から来るかを求める
  // 順方向：元(sx,sy) → 出力(sx+dx,sy+dy)
  // 逆方向：出力(ox,oy) は 元(ox-dx,oy-dy) から来る
  // ただしdxは出力座標ではなく元座標基準で定義されているため
  // 反復法で解く（2回反復で十分）
  var CHUNK=Math.max(1,sH/20|0);

  for(var oy=0;oy<sH;oy++){
    if(oy%CHUNK===0){ setProg(35+oy/sH*50); await sleep(0); }
    for(var ox=0;ox<sW;ox++){
      // フルサイズ換算座標
      var fpx=ox/sc, fpy=oy/sc;

      // 元座標の初期推定（出力座標をそのまま使う）
      var sx=fpx, sy=fpy;

      // 2回反復してより正確な逆変換を求める
      for(var iter=0;iter<2;iter++){
        var ddx=0, ddy=0;
        for(var mi=0;mi<moves.length;mi++){
          var m=moves[mi];
          // 現在の推定元座標で距離を計算
          var d=Math.sqrt((sx-m.cx)*(sx-m.cx)+(sy-m.cy)*(sy-m.cy));
          if(d<m.r){
            var t=d/m.r;
            var w=(1-t*t)*(1-t*t); // 4次減衰
            ddx+=m.fdx*w;
            ddy+=m.fdy*w;
          }
        }
        // 元座標 = 出力座標 - 移動量
        sx=fpx-ddx;
        sy=fpy-ddy;
      }

      // バイリニア補間でサンプリング
      var sxs=sx*sc, sys=sy*sc;
      var x0=Math.floor(sxs), y0=Math.floor(sys);
      var x1=x0+1, y1=y0+1;
      x0=Math.max(0,Math.min(sW-1,x0));
      x1=Math.max(0,Math.min(sW-1,x1));
      y0=Math.max(0,Math.min(sH-1,y0));
      y1=Math.max(0,Math.min(sH-1,y1));
      var tx=sxs-Math.floor(sxs), ty=sys-Math.floor(sys);
      var w00=(1-tx)*(1-ty), w10=tx*(1-ty), w01=(1-tx)*ty, w11=tx*ty;

      var di=(oy*sW+ox)*4;
      var i00=(y0*sW+x0)*4, i10=(y0*sW+x1)*4;
      var i01=(y1*sW+x0)*4, i11=(y1*sW+x1)*4;
      for(var c=0;c<3;c++){
        out[di+c]=Math.round(src[i00+c]*w00+src[i10+c]*w10+src[i01+c]*w01+src[i11+c]*w11);
      }
      out[di+3]=255;
    }
  }

  // フルサイズに戻す
  var imgd=new ImageData(out,sW,sH);
  wctx.putImageData(imgd,0,0);
  ctx.drawImage(wc,0,0,W,H);

  // シェーディング
  if(G.sh>0.01) applyShading(ctx,lm,W,H);
}

// ============================================================
// シェーディング（輪郭に自然な影）
// ============================================================
function applyShading(ctx,lm,W,H){
  var gx=(i,fb)=>lm[i]?lm[i].x:fb;
  var gy=(i,fb)=>lm[i]?lm[i].y:fb;
  var fT=gy(KP.fT,H*.1),fB=gy(KP.fB,H*.9);
  var fL=gx(KP.fL,W*.2),fR=gx(KP.fR,W*.8);
  var fH=fB-fT,fW=fR-fL,fCX=(fL+fR)/2;

  // 肌色サンプリング
  var sx=Math.round(fCX),sy=Math.round(fT+fH*.4);
  var px=ctx.getImageData(Math.max(0,Math.min(W-1,sx)),Math.max(0,Math.min(H-1,sy)),1,1).data;
  var r=Math.max(0,px[0]-50),g=Math.max(0,px[1]-42),b=Math.max(0,px[2]-35);
  var sc='rgba('+r+','+g+','+b+',';

  // 輪郭クリップ
  var path=new Path2D();
  var validOval=OVAL.filter(i=>lm[i]);
  if(validOval.length<3) return;
  path.moveTo(lm[validOval[0]].x,lm[validOval[0]].y);
  validOval.forEach(i=>path.lineTo(lm[i].x,lm[i].y));
  path.closePath();

  var blur=Math.round(fW*.08);
  var sw=fW*.22;
  ctx.save();
  ctx.clip(path);
  ctx.filter='blur('+blur+'px)';

  // 左右シェーディング
  var gL=ctx.createLinearGradient(fL,0,fL+sw,0);
  gL.addColorStop(0,sc+(G.sh*.6)+')'); gL.addColorStop(1,sc+'0)');
  ctx.fillStyle=gL; ctx.fillRect(fL,fT,sw,fH);

  var gR=ctx.createLinearGradient(fR,0,fR-sw,0);
  gR.addColorStop(0,sc+(G.sh*.6)+')'); gR.addColorStop(1,sc+'0)');
  ctx.fillStyle=gR; ctx.fillRect(fR-sw,fT,sw,fH);

  // あご
  var gB=ctx.createLinearGradient(0,fB,0,fB-fH*.2);
  gB.addColorStop(0,sc+(G.sh*.4)+')'); gB.addColorStop(1,sc+'0)');
  ctx.fillStyle=gB; ctx.fillRect(fCX-fW*.35,fB-fH*.2,fW*.7,fH*.2);

  ctx.filter='none';

  // 鼻筋ハイライト
  var nR=lm[KP.nR]||{x:fCX,y:fT+fH*.45};
  var nT2=lm[KP.nT]||{x:fCX,y:fT+fH*.65};
  ctx.filter='blur('+Math.round(fW*.02)+'px)';
  var gN=ctx.createLinearGradient(nR.x-fW*.02,0,nR.x+fW*.02,0);
  gN.addColorStop(0,'rgba(255,252,238,0)');
  gN.addColorStop(.5,'rgba(255,252,238,'+(G.sh*.28)+')');
  gN.addColorStop(1,'rgba(255,252,238,0)');
  ctx.fillStyle=gN; ctx.fillRect(nR.x-fW*.04,nR.y,fW*.08,nT2.y-nR.y);

  ctx.restore();
}

// ============================================================
// 肌補正（顔領域をソフトに明るく・なめらかに）
// ============================================================
function smoothSkin(ctx, lm, W, H){
  var gx=(i,fb)=>lm[i]?lm[i].x:fb;
  var gy=(i,fb)=>lm[i]?lm[i].y:fb;
  var fT=gy(KP.fT,H*.1),fB=gy(KP.fB,H*.9);
  var fL=gx(KP.fL,W*.2),fR=gx(KP.fR,W*.8);
  var fH=fB-fT,fW=fR-fL,fCX=(fL+fR)/2;

  // 顔領域に肌補正オーバーレイを合成
  var path=new Path2D();
  var validOval=OVAL.filter(i=>lm[i]);
  if(validOval.length<3) return;
  path.moveTo(lm[validOval[0]].x,lm[validOval[0]].y);
  validOval.forEach(i=>path.lineTo(lm[i].x,lm[i].y));
  path.closePath();

  ctx.save();
  ctx.clip(path);

  // 1. ソフトフォーカス（ぼかしを薄くオーバーレイ）
  // オフスクリーンでぼかし
  var blur=Math.round(fW*.015);
  var tmp=document.createElement('canvas'); tmp.width=W; tmp.height=H;
  var tc=tmp.getContext('2d');
  tc.filter='blur('+blur+'px)';
  tc.drawImage(ctx.canvas,0,0);
  tc.filter='none';

  // ぼかした版を薄く重ねる
  ctx.globalAlpha=G.skin*0.4;
  ctx.drawImage(tmp,0,0);
  ctx.globalAlpha=1;

  // 2. 肌を少し明るく（顔全体に薄い明るいオーバーレイ）
  ctx.globalCompositeOperation='screen';
  var skinColor=ctx.getImageData(Math.round(fCX),Math.round(fT+fH*.3),1,1).data;
  ctx.fillStyle='rgba('+skinColor[0]+','+skinColor[1]+','+skinColor[2]+','+(G.skin*.08)+')';
  ctx.fillRect(fL,fT,fW,fH);
  ctx.globalCompositeOperation='source-over';

  ctx.restore();
}

// ============================================================
// 表示切替
// ============================================================
function view(type){
  G.curView=type; updCmp(type);
  var rc=document.getElementById('rc');
  var oi=document.getElementById('origImg');
  var W=G.photo.naturalWidth, H=G.photo.naturalHeight;

  if(type==='orig'){
    rc.style.display='none';
    oi.src=G.origUrl; oi.style.display='block';
  } else if(type==='trans'){
    oi.style.display='none';
    rc.style.display='block';
    rc.width=W; rc.height=H;
    if(G.transUrl){ var img=new Image(); img.onload=()=>rc.getContext('2d').drawImage(img,0,0); img.src=G.transUrl; }
  } else if(type==='side'){
    oi.style.display='none';
    rc.style.display='block';
    rc.width=W*2; rc.height=H;
    var ctx=rc.getContext('2d');
    ctx.drawImage(G.photo,0,0);
    if(G.transUrl){
      var img=new Image();
      img.onload=()=>{
        ctx.drawImage(img,W,0);
        ctx.fillStyle='rgba(0,0,0,.55)';
        ctx.fillRect(0,0,W,32); ctx.fillRect(W,0,W,32);
        ctx.fillStyle='#fff'; ctx.font='bold 14px sans-serif'; ctx.textAlign='center';
        ctx.fillText('元の顔',W/2,22); ctx.fillText('変換後',W+W/2,22);
      };
      img.src=G.transUrl;
    }
  }
}

function updCmp(v){
  ['cO','cT','cS'].forEach((id,i)=>{
    document.getElementById(id).className='cmp-btn'+(v===['orig','trans','side'][i]?' on':'');
  });
}

function save(){
  var url=G.curView==='orig'?G.origUrl:(G.transUrl||null);
  if(!url) return;
  if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
    var w=window.open('','_blank');
    if(w){ w.document.write('<img src="'+url+'" style="max-width:100%"><p style="padding:10px;font-family:sans-serif">長押しして保存</p>'); w.document.close(); }
  }else{
    var a=document.createElement('a'); a.download='facetrans_'+Date.now()+'.jpg'; a.href=url; a.click();
  }
}

function setSt(m,t){ var e=document.getElementById('st'); e.textContent=m; e.className='stbox show '+t; }
function setProg(p,show){
  var b=document.getElementById('prog');
  if(show!==undefined){ show?b.classList.add('show'):b.classList.remove('show'); if(!show)return; }
  document.getElementById('pf').style.width=p+'%';
}
</script>
